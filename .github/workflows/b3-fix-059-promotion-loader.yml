name: B3 repair HC 0.59 promotion web loader

on:
  push:
    branches:
      - "fix/0.59-promotion-web-loader-b3"

permissions:
  contents: write

concurrency:
  group: hc-059-promotion-loader-b3
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ControlCenterSoft/home-center-stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/0.59-promotion-web-loader-b3
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded promotion fix and refresh manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          workflow = Path('.github/workflows/promote-qualified-stable-v10.yml')
          text = workflow.read_text(encoding='utf-8')

          old_gate = "(startsWith(github.ref_name, 'promote10/') || startsWith(github.ref_name, 'promote10r2/'))"
          new_gate = "(startsWith(github.ref_name, 'promote10/') || startsWith(github.ref_name, 'promote10r2/') || startsWith(github.ref_name, 'promote10r3/'))"
          if text.count(old_gate) != 1:
              raise SystemExit('PROMOTION_RETRY_GATE_PATCH_FAILED')
          text = text.replace(old_gate, new_gate, 1)

          marker = "              index.write_text(text, encoding='utf-8')"
          insertion = """              for asset in ('device-provider-resolution.js','policy-effective-state.js'):\n                  if (root / 'product/web/static' / asset).is_file():\n                      script = f'<script src=\"/static/{asset}\"></script>'\n                      if script not in text:\n                          if '</body>' not in text:\n                              raise SystemExit('PUBLIC_WEB_BODY_MISSING')\n                          text = text.replace('</body>', f'  {script}\\n</body>', 1)\n              index.write_text(text, encoding='utf-8')"""
          if text.count(marker) != 1:
              raise SystemExit('PROMOTION_WEB_LOADER_PATCH_FAILED')
          text = text.replace(marker, insertion, 1)
          workflow.write_text(text, encoding='utf-8')

          contract = Path('tests/test_stable_promotion_v10_contract.py')
          tests = contract.read_text(encoding='utf-8')
          retry_marker = "        self.assertIn(\"startsWith(github.ref_name, 'promote10/')\", text)"
          retry_new = retry_marker + "\n        self.assertIn(\"startsWith(github.ref_name, 'promote10r3/')\", text)"
          if tests.count(retry_marker) != 1:
              raise SystemExit('PROMOTION_RETRY_TEST_PATCH_FAILED')
          tests = tests.replace(retry_marker, retry_new, 1)
          web_marker = "        self.assertIn(\"python3 tests/security_gate_public_release.py\", text)"
          web_new = web_marker + "\n        self.assertIn(\"'policy-effective-state.js'\", text)\n        self.assertIn(\"script = f'<script src=\\\"/static/{asset}\\\"></script>'\", text)"
          if tests.count(web_marker) != 1:
              raise SystemExit('PROMOTION_WEB_TEST_PATCH_FAILED')
          tests = tests.replace(web_marker, web_new, 1)
          contract.write_text(tests, encoding='utf-8')

          helper = Path('.github/workflows/b3-fix-059-promotion-loader.yml')
          helper.unlink()

          manifest = Path('SOURCE-MANIFEST.sha256')
          if manifest.exists():
              manifest.unlink()
          root = Path.cwd()
          ignored = {'.git','__pycache__'}
          forbidden = {'.hc-dev','.idea','.vscode','dist','docs','ops','secrets'}
          records = []
          for directory, names, files in os.walk(root, topdown=True, followlinks=False):
              base = Path(directory)
              rel_dir = base.relative_to(root)
              names[:] = sorted(name for name in names if name not in ignored)
              if set(rel_dir.parts) & forbidden:
                  raise SystemExit(f'FORBIDDEN_SOURCE_DIRECTORY:{rel_dir.as_posix()}')
              for name in sorted(files):
                  path = base / name
                  rel = path.relative_to(root)
                  if name == 'SOURCE-MANIFEST.sha256' or set(rel.parts) & ignored:
                      continue
                  if set(rel.parts) & forbidden:
                      raise SystemExit(f'FORBIDDEN_SOURCE_PATH:{rel.as_posix()}')
                  if path.is_symlink() or not path.is_file() or path.suffix in {'.pyc','.pyo'}:
                      raise SystemExit(f'SPECIAL_SOURCE_FILE:{rel.as_posix()}')
                  records.append((rel.as_posix(), hashlib.sha256(path.read_bytes()).hexdigest()))
          records.sort(key=lambda item: item[0])
          manifest.write_text(''.join(f'{digest}  {rel}\n' for rel, digest in records), encoding='ascii')
          PY

          python3 deploy/scripts/build-release.py verify-source --source-root .
          python3 -m unittest -v tests.test_stable_promotion_v10_contract
          python3 tests/security_gate_public_release.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain=v1)" || { echo NO_REPAIR_DELTA >&2; exit 66; }
          git commit -m 'fix(stable): carry 0.59 policy scripts through promotion'
          git push origin HEAD:fix/0.59-promotion-web-loader-b3
