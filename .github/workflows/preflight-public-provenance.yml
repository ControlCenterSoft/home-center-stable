name: Preflight public provenance qualification

on:
  push:
    branches:
      - fix/public-stable-provenance-v2-20260912-b1

permissions:
  contents: read

concurrency:
  group: hc-stable-provenance-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'ControlCenterSoft/home-center-stable'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare intended source view
        shell: bash
        run: rm .github/workflows/preflight-public-provenance.yml

      - name: Verify source manifest
        shell: bash
        run: python3 deploy/scripts/build-release.py verify-source --source-root .

      - name: Run unit qualification
        shell: bash
        run: PYTHONPATH=product/control-plane/src python3 -m unittest discover -v -s tests -p 'test_*.py'

      - name: Run public security gate
        shell: bash
        run: python3 tests/security_gate_public_release.py

      - name: Verify runtime imports
        shell: bash
        run: PYTHONPATH=product/control-plane/src python3 -c 'import home_center.actions, home_center.api, home_center.module_admission, home_center.server'
