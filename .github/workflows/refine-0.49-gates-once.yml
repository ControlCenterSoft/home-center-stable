name: Clear stale Home Center 0.49 promotion once

on:
  push:
    branches:
      - fix/public-web-shape-0.49

permissions:
  contents: write

concurrency:
  group: hc-stable-clear-0-49-promotion-once
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Delete stale promotion branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          target="promote7/0.49.0"
          git ls-remote --exit-code origin "refs/heads/$target" >/dev/null
          git push origin ":refs/heads/$target"
          if git ls-remote --exit-code origin "refs/heads/$target" >/dev/null 2>&1; then
            echo PROMOTION_REF_DELETE_FAILED >&2
            exit 66
          fi
          echo "CLEARED_PROMOTION_BRANCH=$target"
