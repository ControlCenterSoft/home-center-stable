name: Recreate Home Center 0.49 promotion once

on:
  push:
    branches:
      - fix/public-web-shape-0.49

permissions:
  contents: write

concurrency:
  group: hc-stable-recreate-0-49-promotion-once
  cancel-in-progress: false

jobs:
  recreate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recreate exact promotion branch from current stable main
        shell: bash
        run: |
          set -Eeuo pipefail
          version="0.49.0"
          target="promote7/$version"
          git fetch --force origin main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$main_sha" = "$remote_main"
          test "$(git show "$main_sha:VERSION")" = "0.48.0"
          test "$(git show "$main_sha:tests/security_gate_public_release.py" | grep -c 'member_change_web = base_web')" = "1"
          git ls-remote --exit-code origin "refs/heads/$target" >/dev/null
          git push origin ":refs/heads/$target"
          git push origin "$main_sha:refs/heads/$target"
          recreated="$(git ls-remote --exit-code origin "refs/heads/$target" | cut -f1)"
          test "$recreated" = "$main_sha"
          echo "RECREATED_PROMOTION_BRANCH=$target"
          echo "PUBLIC_BASE=$main_sha"
