name: Correct Home Center 0.49 public Web gate once

on:
  push:
    branches:
      - fix/public-web-shape-0.49

permissions:
  contents: write

concurrency:
  group: hc-stable-fix-public-web-shape-0-49-once
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Expand closed public Web shape for qualified 0.49 UI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/security_gate_public_release.py')
          text = path.read_text(encoding='utf-8')
          old = 'expected_web = {"app.css", "app.js", "index.html", "planning.css", "planning.js", "release.js"}'
          new = 'expected_web = {"app.css", "app.js", "index.html", "member-change.css", "member-change.js", "planning.css", "planning.js", "release.js"}'
          if text.count(old) != 1:
              raise SystemExit('EXPECTED_WEB_GATE_IDENTITY_MISMATCH')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/fix-public-web-shape-0.49-once.yml
          rm -f SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          root = Path.cwd()
          ignored = {'.git','__pycache__'}
          forbidden = {'.hc-dev','.idea','.vscode','dist','docs','ops','secrets'}
          records = []
          for directory, names, files in os.walk(root, topdown=True, followlinks=False):
              base = Path(directory)
              rel_dir = base.relative_to(root)
              names[:] = sorted(name for name in names if name not in ignored)
              if set(rel_dir.parts) & forbidden:
                  raise SystemExit(f'FORBIDDEN_SOURCE_DIRECTORY:{rel_dir.as_posix()}')
              for name in sorted(files):
                  path = base / name
                  rel = path.relative_to(root)
                  if name == 'SOURCE-MANIFEST.sha256' or set(rel.parts) & ignored:
                      continue
                  if set(rel.parts) & forbidden:
                      raise SystemExit(f'FORBIDDEN_SOURCE_PATH:{rel.as_posix()}')
                  if path.is_symlink() or not path.is_file() or path.suffix in {'.pyc','.pyo'}:
                      raise SystemExit(f'SPECIAL_SOURCE_FILE:{rel.as_posix()}')
                  records.append((rel.as_posix(), hashlib.sha256(path.read_bytes()).hexdigest()))
          records.sort(key=lambda item: item[0])
          Path('SOURCE-MANIFEST.sha256').write_text(
              ''.join(f'{digest}  {rel}\n' for rel, digest in records), encoding='ascii'
          )
          PY
          python3 deploy/scripts/build-release.py verify-source --source-root .

      - name: Commit exact gate correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/fix-public-web-shape-0.49-once.yml\nSOURCE-MANIFEST.sha256\ntests/security_gate_public_release.py'
          git commit -m 'HC stable: admit qualified 0.49 member-change Web assets'
          git push origin HEAD:fix/public-web-shape-0.49
