name: HC B3 integrate public provenance promotion

on:
  push:
    branches:
      - automation/hc-057-stable-provenance-promotion-b3-20260912

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: automation/hc-057-stable-provenance-promotion-b3-20260912

      - name: Wire public provenance v2 into candidate and release bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('deploy/scripts/build-release.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'PATCH_ANCHOR_MISMATCH count={count} anchor={old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'RELEASE_MANIFEST_NAME = f"home-center-{VERSION}.release-manifest.json"\nCHECKSUMS_NAME = "SHA256SUMS"\nPAYLOAD_NAMES = (RUNTIME_ARCHIVE, SOURCE_ARCHIVE, SBOM_NAME, ACCEPTANCE_NAME, RELEASE_MANIFEST_NAME)\n',
              'RELEASE_MANIFEST_NAME = f"home-center-{VERSION}.release-manifest.json"\nPROVENANCE_NAME = f"home-center-{VERSION}.public-provenance.v2.json"\nCHECKSUMS_NAME = "SHA256SUMS"\nPAYLOAD_NAMES = (RUNTIME_ARCHIVE, SOURCE_ARCHIVE, SBOM_NAME, ACCEPTANCE_NAME, RELEASE_MANIFEST_NAME, PROVENANCE_NAME)\n',
          )

          replace_once(
              '    ACCEPTANCE_NAME: "application/vnd.home-center.acceptance+json",\n}\n',
              '    ACCEPTANCE_NAME: "application/vnd.home-center.acceptance+json",\n    PROVENANCE_NAME: "application/vnd.home-center.provenance+json",\n}\n',
          )

          marker = '\ndef build_candidate(source_root: Path, output_root: Path, revision: str, epoch: int) -> None:\n'
          if text.count(marker) != 1:
              raise SystemExit('BUILD_CANDIDATE_ANCHOR_MISMATCH')
          helper = r'''

PROVENANCE_KEYS = {
    "schema",
    "product",
    "version",
    "source_identity_sha256",
    "release_boundary_identity_sha256",
    "approved_manifest_sha256",
    "summary",
    "files",
}
PROVENANCE_FILE_KEYS = {"path", "approved_sha256", "disposition", "stable_sha256", "reason"}
PROVENANCE_DISPOSITIONS = {"identical", "adapted", "excluded"}


def validate_public_provenance(path: Path) -> dict[str, object]:
    value = read_json(path)
    _require(isinstance(value, dict) and set(value) == PROVENANCE_KEYS, "public_provenance_invalid")
    _require(
        value.get("schema") == "home-center.public-stable-provenance.v2"
        and value.get("product") == PRODUCT
        and value.get("version") == VERSION,
        "public_provenance_identity_mismatch",
    )
    for key in ("source_identity_sha256", "release_boundary_identity_sha256", "approved_manifest_sha256"):
        _require(isinstance(value.get(key), str) and HEX64.fullmatch(str(value[key])) is not None, "public_provenance_digest_invalid")

    summary = value.get("summary")
    _require(isinstance(summary, dict) and set(summary) == {"total", "identical", "adapted", "excluded"}, "public_provenance_summary_invalid")
    for key in ("total", "identical", "adapted", "excluded"):
        _require(isinstance(summary.get(key), int) and not isinstance(summary.get(key), bool) and int(summary[key]) >= 0, "public_provenance_summary_invalid")
    _require(summary["total"] == summary["identical"] + summary["adapted"] + summary["excluded"], "public_provenance_summary_invalid")

    records = value.get("files")
    _require(isinstance(records, list) and len(records) == summary["total"], "public_provenance_files_invalid")
    paths: list[str] = []
    counts = {"identical": 0, "adapted": 0, "excluded": 0}
    for record in records:
        _require(isinstance(record, dict) and set(record) == PROVENANCE_FILE_KEYS, "public_provenance_file_invalid")
        name = record.get("path")
        _require(isinstance(name, str), "public_provenance_file_invalid")
        _safe_relative(name, "public_provenance_file_invalid")
        approved = record.get("approved_sha256")
        _require(isinstance(approved, str) and HEX64.fullmatch(approved) is not None, "public_provenance_file_invalid")
        disposition = record.get("disposition")
        _require(disposition in PROVENANCE_DISPOSITIONS, "public_provenance_file_invalid")
        counts[str(disposition)] += 1
        stable = record.get("stable_sha256")
        if disposition == "excluded":
            _require(stable is None, "public_provenance_file_invalid")
        else:
            _require(isinstance(stable, str) and HEX64.fullmatch(stable) is not None, "public_provenance_file_invalid")
        paths.append(name)
    _require(paths == sorted(set(paths)), "public_provenance_files_invalid")
    _require(all(summary[key] == counts[key] for key in counts), "public_provenance_summary_invalid")

    payload = path.read_bytes()
    for forbidden in (b'"approved_repository"', b'"approved_revision"', b'"stable_release_boundary_revision"'):
        _require(forbidden not in payload, "public_provenance_identity_leak")
    _require(payload == canonical_json(value), "public_provenance_not_canonical")
    return value


def generate_public_provenance(source_root: Path, output_path: Path) -> None:
    tool = source_root / "scripts/export_public_stable_provenance.py"
    mapping = source_root / "APPROVED-SOURCE.json"
    _regular(tool, "public_provenance_exporter_rejected")
    _regular(mapping, "public_provenance_mapping_rejected")
    try:
        completed = subprocess.run(
            [sys.executable, str(tool), "--input", str(mapping), "--output", str(output_path)],
            cwd=source_root,
            check=False,
            capture_output=True,
            text=True,
            timeout=30,
        )
    except (OSError, subprocess.SubprocessError) as exc:
        raise PublicReleaseError("public_provenance_export_failed") from exc
    _require(completed.returncode == 0, "public_provenance_export_failed")
    validate_public_provenance(output_path)
'''
          text = text.replace(marker, helper + marker, 1)

          replace_once(
              '        generate_acceptance(output_root, runtime_a, runtime_b, source_a, source_b, revision, epoch)\n        generate_release_manifest(output_root, revision, epoch)\n',
              '        generate_acceptance(output_root, runtime_a, runtime_b, source_a, source_b, revision, epoch)\n        generate_public_provenance(source_root, output_root / PROVENANCE_NAME)\n        generate_release_manifest(output_root, revision, epoch)\n',
          )

          replace_once(
              '    validate_acceptance(root / ACCEPTANCE_NAME, root, revision, epoch)\n    validate_release_manifest(root / RELEASE_MANIFEST_NAME, root, revision, epoch)\n',
              '    validate_acceptance(root / ACCEPTANCE_NAME, root, revision, epoch)\n    validate_public_provenance(root / PROVENANCE_NAME)\n    validate_release_manifest(root / RELEASE_MANIFEST_NAME, root, revision, epoch)\n',
          )

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/b3-integrate-public-provenance.yml
          rm -f SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('deploy/scripts/build-release.py').resolve()
          spec = importlib.util.spec_from_file_location('hc_public_release_builder', path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.create_source_manifest(Path('.').resolve())
          PY

          python3 deploy/scripts/build-release.py verify-source --source-root .
          python3 -m unittest -v tests.test_public_stable_provenance
          python3 -m py_compile deploy/scripts/build-release.py scripts/export_public_stable_provenance.py
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -vE '^( M|M | D|D |\?\?) (deploy/scripts/build-release.py|SOURCE-MANIFEST.sha256|.github/workflows/b3-integrate-public-provenance.yml)$' || true)"

      - name: Commit exact B3 integration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'HC Stable: integrate public provenance v2 into release bundle'
          git push origin HEAD:automation/hc-057-stable-provenance-promotion-b3-20260912
