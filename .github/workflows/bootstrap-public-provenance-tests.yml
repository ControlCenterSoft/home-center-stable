name: Bootstrap public provenance release-contract tests

on:
  push:
    branches:
      - fix/public-stable-provenance-v2-20260912-b1

permissions:
  contents: write

concurrency:
  group: hc-stable-provenance-tests-bootstrap
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ControlCenterSoft/home-center-stable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Admit public provenance v2 in release-contract test and refresh manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm .github/workflows/bootstrap-public-provenance-tests.yml
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_public_release.py')
          value = path.read_text(encoding='utf-8')
          old = '''            "public-release-manifest.v1.schema.json": "home-center.public-release-manifest.v1",\n'''
          new = old + '''            "public-stable-provenance.v2.schema.json": "home-center.public-stable-provenance.v2",\n'''
          if value.count(old) != 1 or '"public-stable-provenance.v2.schema.json": "home-center.public-stable-provenance.v2"' in value:
              raise SystemExit('RELEASE_CONTRACT_TEST_SHAPE_UNEXPECTED')
          path.write_text(value.replace(old, new), encoding='utf-8')
          PY
          rm SOURCE-MANIFEST.sha256
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('deploy/scripts/build-release.py')
          spec = importlib.util.spec_from_file_location('hc_build_release', path)
          if spec is None or spec.loader is None:
              raise SystemExit('BUILD_RELEASE_IMPORT_FAILED')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.create_source_manifest(Path('.'))
          PY
          changed="$(git diff --name-only)"
          test "$changed" = $'.github/workflows/bootstrap-public-provenance-tests.yml\nSOURCE-MANIFEST.sha256\ntests/test_public_release.py' || {
            printf 'UNEXPECTED_CHANGED_FILES\n%s\n' "$changed" >&2
            exit 66
          }
          git config user.name 'ControlCenterSoft'
          git config user.email '40738562+ControlCenterSoft@users.noreply.github.com'
          git add -A
          git commit -m 'HC Stable: admit public provenance v2 release contract'
          git push origin "HEAD:${{ github.ref_name }}"
